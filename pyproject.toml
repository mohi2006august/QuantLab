[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab"
version = "0.1.0"
description = "Estimate and compare open LLM quantization configurations for local hardware."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "QuantLab contributors" }]
dependencies = []

[project.scripts]
quantlab = "quantlab.cli:main"

[tool.setuptools.packages.find]
include = ["quantlab*"]
